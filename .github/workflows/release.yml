name: release

# Every artifact a release publishes is signed with sigstore (keyless,
# through this workflow's OIDC identity), the wheel is built twice and
# compared, and a CycloneDX SBOM travels with the release, as does a
# signed manifest of the MCP server's tools (velaris mcp-verify) and a
# signed in-toto attestation of one example program (velaris attest).
# Every third-party action is pinned to a commit; the tag it was
# resolved from is in the comment beside it. SECURITY.md says how to
# verify.
#
# Run by hand (workflow_dispatch) on a branch, only the attestation job
# runs: it signs and verifies the attestation under this workflow's
# identity at that branch, and publishes nothing - the way to see that
# a release can produce one before a tag asks it to.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dist:
    name: wheel and sdist, signed, with SBOM
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write            # attach files to the release
      id-token: write            # sigstore keyless signing
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - name: Build the distribution
        run: |
          pip install build
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) python -m build
          ls -l dist
      - name: Generate the SBOM (CycloneDX)
        run: |
          pip install cyclonedx-bom
          python -m venv sbom-env
          sbom-env/bin/pip install "$(ls dist/*.whl)[full]"
          cyclonedx-py environment --of JSON \
            --mc-type application \
            -o "dist/velaris-lang-${GITHUB_REF_NAME#v}.cdx.json" \
            sbom-env/bin/python
          python -c "import json,sys; d=json.load(open(sys.argv[1])); print(d['bomFormat'], d['specVersion'], len(d.get('components', [])), 'components')" \
            "dist/velaris-lang-${GITHUB_REF_NAME#v}.cdx.json"
      # Every MCP tool's name, description hash and input-schema hash,
      # asked of the server inside the wheel this job publishes - the
      # server a client will run - so what is signed is what ships.
      - name: The MCP tool manifest, from the server in the wheel
        run: |
          python -m venv mcp-env
          mcp-env/bin/pip install "$(ls dist/*.whl)"
          mcp-env/bin/velaris mcp-manifest \
            -o "dist/velaris-mcp-tools-${GITHUB_REF_NAME#v}.json" \
            -- mcp-env/bin/python -m velaris_mcp
          cat "dist/velaris-mcp-tools-${GITHUB_REF_NAME#v}.json"
      - name: Sign the wheel, the sdist, the SBOM and the tool manifest (sigstore)
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9  # v3.5.0
        with:
          inputs: |
            ./dist/*.whl
            ./dist/*.tar.gz
            ./dist/*.cdx.json
            ./dist/velaris-mcp-tools-*.json
      # The check a client operator runs, with the real signature: it
      # must verify as this workflow at this tag, and every tool of the
      # wheel's server must match it.
      - name: Check the signed manifest against the server in the wheel
        run: |
          mcp-env/bin/pip install sigstore
          mcp-env/bin/velaris mcp-verify \
            "dist/velaris-mcp-tools-${GITHUB_REF_NAME#v}.json" \
            -- mcp-env/bin/python -m velaris_mcp
      - name: Checksums
        run: |
          cd dist
          sha256sum *.whl *.tar.gz *.cdx.json velaris-mcp-tools-*.json > SHA256SUMS
          cat SHA256SUMS
      - name: Keep the distribution for the PyPI job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
      - name: Attach to the GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.cdx.json
            dist/velaris-mcp-tools-*.json
            dist/*.sigstore.json
            dist/SHA256SUMS

  reproducible:
    name: the wheel builds the same twice
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - name: Build twice with the same SOURCE_DATE_EPOCH and compare
        run: |
          pip install build
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
          python -m build --wheel --outdir build1
          rm -rf build          # hatchling's intermediate directory
          python -m build --wheel --outdir build2
          a=$(ls build1/*.whl); b=$(ls build2/*.whl)
          sha256sum "$a" "$b"
          if cmp -s "$a" "$b"; then
            echo "reproducible: both builds are byte-identical"
            echo "wheel sha256: $(sha256sum "$a" | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "NOT reproducible: the two wheels differ"
            diff <(unzip -l "$a") <(unzip -l "$b") || true
            exit 1
          fi

  bundle:
    name: the double-click bundle, signed
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - run: python build_mcpb.py
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - name: Sign velaris.mcpb (cosign, keyless)
        run: |
          cosign sign-blob --yes velaris.mcpb \
            --output-signature velaris.mcpb.sig \
            --output-certificate velaris.mcpb.pem \
            --bundle velaris.mcpb.sigstore.json
          sha256sum velaris.mcpb > velaris.mcpb.sha256
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: |
            velaris.mcpb
            velaris.mcpb.sig
            velaris.mcpb.pem
            velaris.mcpb.sigstore.json
            velaris.mcpb.sha256

  binaries:
    name: standalone executable, signed
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: velaris-windows.exe
            sep: ";"
          - os: ubuntu-latest
            asset: velaris-linux
            sep: ":"
          - os: macos-latest
            asset: velaris-macos
            sep: ":"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - name: Install with proofs, native speed, and PyInstaller
        run: pip install ".[full]" pyinstaller
      - name: Build standalone executable
        run: >
          pyinstaller --onefile --name velaris
          --collect-all z3 --collect-all llvmlite
          --add-data "stdlib${{ matrix.sep }}stdlib"
          velaris.py
      - name: Smoke test the executable
        shell: bash
        run: |
          ./dist/velaris* --version
          ./dist/velaris* doctor
          ./dist/velaris* examples/hello.vel
      - name: Rename asset
        shell: bash
        run: |
          cd dist
          for f in velaris velaris.exe; do
            [ -f "$f" ] && mv "$f" "${{ matrix.asset }}"
          done
          ls
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - name: Sign the executable (cosign, keyless)
        shell: bash
        run: |
          cd dist
          cosign sign-blob --yes "${{ matrix.asset }}" \
            --output-signature "${{ matrix.asset }}.sig" \
            --output-certificate "${{ matrix.asset }}.pem" \
            --bundle "${{ matrix.asset }}.sigstore.json"
          sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          ls
      - name: Attach to the GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sig
            dist/${{ matrix.asset }}.pem
            dist/${{ matrix.asset }}.sigstore.json
            dist/${{ matrix.asset }}.sha256
          generate_release_notes: true

  pypi:
    name: publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [dist, reproducible]
    runs-on: ubuntu-latest
    # until a pending publisher exists on pypi.org this cannot succeed,
    # and a release should not be marked broken for that reason
    continue-on-error: true
    permissions:
      id-token: write            # trusted publishing, no API token stored
    steps:
      - name: The same files that were signed
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist
          path: dist
      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          skip-existing: true

  vscode:
    name: publish the VS Code extension
    runs-on: ubuntu-latest
    # needs a one-time VSCE_TOKEN secret; until then this is skipped
    if: ${{ startsWith(github.ref, 'refs/tags/v') && github.repository_owner != '' }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"
      - name: Publish to the Marketplace
        working-directory: editor/vscode
        run: |
          if [ -z "$VSCE_TOKEN" ]; then
            echo "no VSCE_TOKEN secret set - skipping"
            exit 0
          fi
          npm install -g @vscode/vsce
          TAG="${GITHUB_REF_NAME#v}"       # the tag is the version
          case "$(echo "$TAG" | tr -cd '.' | wc -c)" in
            0) TAG="$TAG.0.0" ;;           # npm wants three parts:
            1) TAG="$TAG.0" ;;             # v2.36 becomes 2.36.0
          esac
          npm version "$TAG" --no-git-tag-version --allow-same-version
          if vsce publish --pat "$VSCE_TOKEN"; then
            echo "published $TAG"
          elif vsce show gowrishankar-infra.velaris | grep -q "$TAG"; then
            echo "$TAG is already on the Marketplace - nothing to do"
          else
            echo "publish failed for a real reason"
            exit 1
          fi
        env:
          VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}

  attestation:
    name: a signed in-toto attestation of one example program
    runs-on: ubuntu-latest
    permissions:
      contents: write            # attach files to the release, on a tag
      id-token: write            # sigstore keyless signing
    env:
      PREDICATE_TYPE: https://gowrishankar-infra.github.io/velaris-lang/capability/v1
      OIDC_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      # with the prover, as a reviewer's machine would have it: the
      # audit says whether one ran (prover), so the Statement differs
      # without it
      - name: This commit's Velaris with its prover, and sigstore-python
        run: pip install ".[full]" "sigstore==4.5.0"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      # the Statement, unsigned, as velaris attest writes it; the time is
      # the commit's, so two runs of one commit write the same bytes
      - name: The Statement, from velaris attest
        run: |
          V=$(python -c "import velaris; print(velaris.VERSION)")
          echo "ATT=velaris-attestation-$V" >> "$GITHUB_ENV"
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) \
            velaris attest examples/effects.vel --output "velaris-attestation-$V.intoto.json"
          cat "velaris-attestation-$V.intoto.json"
      - name: Signed with cosign, as a DSSE envelope (keyless)
        run: |
          cosign attest-blob --yes --statement "$ATT.intoto.json" \
            --bundle "$ATT.cosign.sigstore.json"
      # sigstore-python's command line attests only SLSA provenance, so
      # this uses its library, as EMBEDDING.md shows
      - name: Signed with sigstore-python, as a DSSE envelope (keyless)
        run: |
          python - "$ATT.intoto.json" "$ATT.sigstore-python.sigstore.json" <<'EOF'
          import sys
          from sigstore.dsse import Statement
          from sigstore.models import ClientTrustConfig
          from sigstore.oidc import IdentityToken, detect_credential
          from sigstore.sign import SigningContext
          statement_file, bundle_file = sys.argv[1], sys.argv[2]
          statement = Statement(open(statement_file, "rb").read())
          context = SigningContext.from_trust_config(ClientTrustConfig.production())
          with context.signer(IdentityToken(detect_credential())) as signer:
              bundle = signer.sign_dsse(statement)
          open(bundle_file, "w").write(bundle.to_json())
          EOF
      # both must verify as this workflow at this ref, over this exact
      # Statement, naming the digest of the file it attests
      - name: Both verify, as this workflow, against the example's bytes
        run: |
          IDENTITY="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
          echo "identity: $IDENTITY"
          cosign verify-blob-attestation --bundle "$ATT.cosign.sigstore.json" \
            --type "$PREDICATE_TYPE" --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer "$OIDC_ISSUER" examples/effects.vel
          python - "$ATT.sigstore-python.sigstore.json" "$ATT.intoto.json" "$IDENTITY" <<'EOF'
          import hashlib, json, os, sys
          from sigstore.models import Bundle
          from sigstore.verify import Verifier
          from sigstore.verify.policy import Identity
          bundle_file, statement_file, identity = sys.argv[1:4]
          bundle = Bundle.from_json(open(bundle_file, "rb").read())
          kind, payload = Verifier.production().verify_dsse(
              bundle, Identity(identity=identity, issuer=os.environ["OIDC_ISSUER"]))
          signed = json.loads(payload)
          assert kind == "application/vnd.in-toto+json", kind
          assert signed == json.load(open(statement_file, encoding="utf-8")), "not this Statement"
          assert signed["predicateType"] == os.environ["PREDICATE_TYPE"]
          digest = hashlib.sha256(open("examples/effects.vel", "rb").read()).hexdigest()
          assert signed["subject"][0]["digest"]["sha256"] == digest, "another file"
          print("sigstore-python: verified, as", identity)
          EOF
      - name: Keep them
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: attestation
          path: velaris-attestation-*
          if-no-files-found: error
      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: velaris-attestation-*
